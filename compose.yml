services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: greener
      POSTGRES_USER: greener
      POSTGRES_PASSWORD: greener_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greener -d greener"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: